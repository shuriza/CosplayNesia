name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: php artisan test
      - run: vendor/bin/pint --test
      - run: npm run build
      - run: composer audit --locked

  postgres:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:Mb4PKB1DDd/m96oZLjvvxzXNpUkyJwSJwD91L5LcujA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: cosplaynesia_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cosplaynesia_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosplaynesia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pcntl, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Require concurrent-writer support
        run: |
          php -r "exit(function_exists('pcntl_fork') ? 0 : 1);"
      - name: Run PostgreSQL suite without warnings
        run: >-
          php vendor/bin/phpunit
          --configuration=phpunit.pgsql.xml
          --stop-on-warning
          --display-warnings
          --fail-on-warning
          --colors=never
      - name: Migration rollback drill
        run: |
          php artisan migrate:fresh --seed --force
          php artisan migrate:rollback --step=2 --force
          php artisan migrate --force
      - name: PostgreSQL backup and restore drill
        env:
          PGPASSWORD: postgres
        run: |
          pg_dump --host=127.0.0.1 --username=postgres --format=custom --file=storage/app/cosplaynesia.dump cosplaynesia_test
          createdb --host=127.0.0.1 --username=postgres cosplaynesia_restore
          pg_restore --host=127.0.0.1 --username=postgres --dbname=cosplaynesia_restore --exit-on-error storage/app/cosplaynesia.dump
          DB_DATABASE=cosplaynesia_restore php artisan migrate:status --no-interaction
      - name: Failed-release database rollback drill
        env:
          PGPASSWORD: postgres
        run: |
          expected_products=$(psql --host=127.0.0.1 --username=postgres --dbname=cosplaynesia_test --tuples-only --no-align --command='select count(*) from products')
          pg_dump --host=127.0.0.1 --username=postgres --format=custom --file=storage/app/pre-failed-release.dump cosplaynesia_test
          psql --host=127.0.0.1 --username=postgres --dbname=cosplaynesia_test --command='truncate table products cascade'
          test "$(psql --host=127.0.0.1 --username=postgres --dbname=cosplaynesia_test --tuples-only --no-align --command='select count(*) from products')" = "0"
          dropdb --host=127.0.0.1 --username=postgres --maintenance-db=postgres --force cosplaynesia_test
          createdb --host=127.0.0.1 --username=postgres --maintenance-db=postgres --owner=postgres cosplaynesia_test
          pg_restore --host=127.0.0.1 --username=postgres --dbname=cosplaynesia_test --exit-on-error storage/app/pre-failed-release.dump
          test "$(psql --host=127.0.0.1 --username=postgres --dbname=cosplaynesia_test --tuples-only --no-align --command='select count(*) from products')" = "$expected_products"
          php artisan migrate:status --no-interaction

  container:
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:Mb4PKB1DDd/m96oZLjvvxzXNpUkyJwSJwD91L5LcujA=
      STAGING_HOST: staging.example.test
      DB_PASSWORD: staging-database-password
      S3_ACCESS_KEY: staging-access-key
      S3_SECRET_KEY: staging-object-storage-secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging topology
        run: docker compose --file compose.staging.yml config --quiet
      - name: Build production image from zero
        run: docker build --tag cosplaynesia:${{ github.sha }} .
      - name: Verify required runtime extensions
        run: >-
          docker run --rm --entrypoint php
          cosplaynesia:${{ github.sha }}
          -r "exit(extension_loaded('mbstring') && extension_loaded('pcntl') && extension_loaded('pdo_pgsql') ? 0 : 1);"
