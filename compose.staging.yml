name: cosplaynesia-staging

x-app: &app
  build:
    context: .
    target: runtime
  image: cosplaynesia:${IMAGE_TAG:-staging}
  restart: unless-stopped
  environment:
    APP_NAME: CosplayNesia
    APP_ENV: production
    APP_KEY: ${APP_KEY:?APP_KEY is required}
    APP_DEBUG: "false"
    APP_URL: https://${STAGING_HOST:?STAGING_HOST is required}
    LOG_CHANNEL: stderr
    LOG_LEVEL: info
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: cosplaynesia
    DB_USERNAME: cosplaynesia
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    DB_SSLMODE: prefer
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    SESSION_DRIVER: database
    SESSION_ENCRYPT: "true"
    SESSION_SECURE_COOKIE: "true"
    FILESYSTEM_DISK: s3
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    AWS_DEFAULT_REGION: ap-southeast-1
    AWS_BUCKET: cosplaynesia
    AWS_ENDPOINT: http://object-storage:9000
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
  networks: [app]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cosplaynesia
      POSTGRES_USER: cosplaynesia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosplaynesia -d cosplaynesia"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app]

  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app]

  object-storage-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://object-storage:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing local/cosplaynesia
    depends_on:
      object-storage:
        condition: service_healthy
    networks: [app]

  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "php artisan app:validate-runtime && php artisan migrate --force --no-interaction"]
    depends_on:
      postgres:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully

  web:
    <<: *app
    expose: ["80"]
    depends_on: &runtime-dependencies
      migrate:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "database", "--sleep=1", "--tries=3", "--timeout=90", "--max-time=3600"]
    depends_on: *runtime-dependencies

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on: *runtime-dependencies

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      STAGING_HOST: ${STAGING_HOST:?STAGING_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [app]

volumes:
  postgres-data:
  object-data:
  caddy-data:
  caddy-config:

networks:
  app:
